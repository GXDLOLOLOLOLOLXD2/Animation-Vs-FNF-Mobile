name: Android Test Build

on:
  push:
    branches: ['mobile']
  workflow_dispatch:

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Setup Java JDK
        uses: actions/setup-java@v1
        with:
          java-version: 11

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install lime 7.9.0 --quiet
          haxelib install openfl 9.1.0 --quiet
          haxelib install flixel 4.9.0 --quiet
          haxelib set flixel 4.9.0
          haxelib install flixel-addons 2.10.0 --quiet
          haxelib set flixel-addons 2.10.0
          haxelib install flixel-ui 2.3.3 --quiet
          haxelib install flixel-tools --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib git hxCodec https://github.com/polybiusproxy/hxcodec.git
          haxelib git linc_luajit https://github.com/jigsaw-4277821/linc_luajit.git
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git

      - name: Setup Lime Config
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.setup-ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib set lime 7.9.0
          haxelib set openfl 9.1.0

      - name: Build APK
        run: haxelib run lime build android -final

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: AnimationVsFNF-Mobile
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
