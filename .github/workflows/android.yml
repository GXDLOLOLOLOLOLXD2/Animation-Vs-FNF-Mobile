name: Android Build

on:
  push:
    branches: ['mobile']
  workflow_dispatch:

jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1.1.5
        with:
          haxe-version: 4.3.6 # 4.2.5 or 4.3.6

      - name: Restore existing build cache for faster compilation
        uses: actions/cache@v3
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          key: cache-build-android
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android

      - name: Install Haxelibs
        run: |
          # hxcpp, lime, openfl, flixel-*, hscript, actuate, linc_luajit, hxCodec, extension-androidtools.
          haxelib setup ~/haxelib
          haxelib install hxcpp --quiet
          haxelib install lime 8.2.2 --quiet
          haxelib install openfl 9.4.1 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.1.1 --quiet
          haxelib install flixel-ui 2.6.1 --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install flixel-tools --quiet
          haxelib git linc_luajit https://github.com/MaysLastPlays-Stuff/linc_luajit
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git
          # compatibilty libraries
          haxelib git extension-webview https://github.com/Daninnocent/extension-webview.git --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git --quiet
          haxelib install hxcodec
          # end of adictions libraries
          haxelib list

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.setup-ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib set flixel 5.6.1
          haxelib set flixel-addons 3.1.1
          haxelib set flixel-ui 2.6.1
          haxelib set lime 8.2.2
          haxelib set openfl 9.4.1

      - name: Compile
        run: haxelib run openfl build android --app-version="${{ github.run_id }}" -final

      - name: Publish Build
        uses: actions/upload-artifact@main
        with:
          name: VsAnimationBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk