name: With Addictions

on:
  push:
    branches: ["mobile"]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c  # r25e no exists, use r25c or r26b

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1.1.5
        with:
          haxe-version: 4.3.6

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          # Base required libraries
          haxelib install hxcpp --quiet
          haxelib install lime 8.2.2 --quiet
          haxelib install openfl 9.4.1 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-ui 2.6.1 --quiet
          haxelib install flixel-addons 3.1.1 --quiet
          haxelib install flixel-tools --quiet
          haxelib install hscript --quiet
          haxelib install actuate --quiet
          haxelib install hxcpp-debug-server --quiet

          # Required for mobile + cutscenes + Lua
          haxelib git linc_luajit https://github.com/MaysLastPlays-Stuff/linc_luajit.git --quiet
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git --quiet
          haxelib git extension-webview https://github.com/Daninnocent/extension-webview.git --quiet
          haxelib install extension-webm --quiet

          # Desktop-specific
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git --quiet

          # Optional Switch support (remove if not needed)
          # haxelib install faxe --quiet

          haxelib list

      - name: Instalar hxcodec com VideoSprite (offline)
        run: |
         unzip libs/hxcodec-legacy-videosprite.zip -d hxcodec
         haxelib dev hxcodec hxcodec

      - name: Ajustar flags do hxcpp
        run: |
         echo "HXCPP_CONFIG=\"-DHXCPP_NO_AUTO_PCH\"" >> $GITHUB_ENV

      - name: Setup Lime
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib set lime 8.2.2
          haxelib set openfl 9.4.1
          haxelib set flixel 5.6.1
          haxelib set flixel-addons 3.1.1
          haxelib set flixel-ui 2.6.1

      - name: Build APK
        run: |
         haxelib run openfl build android --app-version="${{ github.run_id }}" -final
        env:
         HXCPP_CONFIG: "-DHXCPP_NO_AUTO_PCH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimationVsFNFMobile
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
