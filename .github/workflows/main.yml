name: Android Main Build
on:
  push:
    branches: ['mobile']
  workflow_dispatch:
jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@main #v2
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1.1.5 #v1
        with:
          haxe-version: 4.2.5 # 4.3.6 or 4.2.5
      - name: Setting up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Restore existing build cache for faster compilation
        uses: actions/cache@v3
        with:
          # not caching the bin folder to prevent asset duplication and stuff like that
          key: cache-build-android
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android
      - name: Installing required Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install flixel 5.3.1
          haxelib set flixel 5.3.1
          haxelib install flixel-addons
          haxelib install flixel-ui 2.6.4
          haxelib set flixel-ui 2.6.4
          haxelib install hscript
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git
          haxelib install hxcpp-debug-server
          haxelib install lime
          haxelib install openfl
      - name: Configuring Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
      - name: Building the game
        run: haxelib run lime build android
      - name: Uploading artifact
        uses: actions/upload-artifact@main #v4
        with:
          name: VsAnimationBuild
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
